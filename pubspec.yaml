name: fiscus_tap
description: "Fiscus Tap - Native iOS Contactless POS App with NFC support for iPhone 11+"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_nfc_kit: ^3.5.2
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
